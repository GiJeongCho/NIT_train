# NIT_train 배포 — 학습/라벨링 API(백엔드) + 정적 프런트
#
# 실행:
#   docker compose up -d --build        # 빌드+기동
#   docker compose ps                   # 상태
#   화면: http://<호스트>:8890   /   API·Swagger: http://<호스트>:8888/docs
#
# 버전 스탬프는 scripts/release.ps1 / release.sh 가 VERSION·GIT_SHA·BUILD_DATE·
# NIT_TRAIN_TAG 를 환경에 넣어 호출한다. 수동 빌드면 .env(.env.example 참고)로 준다.
services:
  nit-train:
    build:
      context: .
      args:
        VERSION: ${VERSION:-0.0.0}
        GIT_SHA: ${GIT_SHA:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: nit-train:${NIT_TRAIN_TAG:-latest}
    container_name: nit-train
    ports:
      - "8888:8888"
    volumes:
      # 모든 작업 상태. 이것만 보존하면 컨테이너를 갈아끼워도 라벨링/학습 결과가 남는다.
      - ./workspace:/app/workspace
      # 사전학습 가중치. 이미지에 굽지 않고 마운트하면 모델 교체 시 재빌드가 필요 없다.
      - ./test_model:/app/test_model
      # (선택) 외부 데이터셋 원본 재임포트가 필요할 때만 열기. 학습 이미지는 이미
      # workspace 로 복사돼 있어 평소엔 필요 없다. 민감하지 않은 데이터만 둘 것.
      # - ./external_datasets:/app/external_datasets:ro
    environment:
      NIT_TRAIN_DEVICE: "${NIT_TRAIN_DEVICE:-0}"
      # 워커가 많으면 RAM 을 크게 문다. 컨테이너 메모리 한도에 맞춰 조정.
      NIT_TRAIN_WORKERS: "4"
      # 승격 모델을 추론 서비스로 배포하려면 그 models 폴더를 마운트하고 여기에 지정한다.
      # NIT_TRAIN_TRACKER_MODELS_DIR: /mnt/tracker-models
      # NIT_TRAIN_TRACKER_API: http://tracker-py:8886
    # 학습 DataLoader 워커는 공유메모리를 쓴다. 기본 64MB 면 후반 epoch 에서 죽는다.
    shm_size: "8gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # GPU 가 없는 호스트면 이 deploy 블록을 지우거나 docker-compose.cpu.yml 오버라이드를 쓴다.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nit-train-front:
    build:
      context: ../NIT_train_front
      args:
        VERSION: ${VERSION:-0.0.0}
        GIT_SHA: ${GIT_SHA:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: nit-train-front:${NIT_TRAIN_TAG:-latest}
    container_name: nit-train-front
    ports:
      - "8890:8890"
    environment:
      # 비우면 브라우저가 "현재 호스트:8888" 을 API 로 쓴다(같은 호스트 배포 기본값).
      # 백엔드가 다른 호스트면 http://<백엔드IP>:8888 로 지정.
      NIT_TRAIN_API: "${NIT_TRAIN_API:-}"
    depends_on:
      - nit-train
    restart: unless-stopped
